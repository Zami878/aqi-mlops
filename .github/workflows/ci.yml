name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint-test:
    name: Lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - name: Test (pytest)
        run: pytest -v

  build-smoke:
    name: Build image + smoke test
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t aqi-api:ci .
      - name: Run container
        run: docker run -d --name aqi -p 8000:8000 aqi-api:ci
      - name: Smoke test /health and /version
        run: |
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/health && break
            sleep 1
          done
          curl -fsS http://localhost:8000/health | grep -q '"ok"'
          curl -fsS http://localhost:8000/version | grep -q "${{ github.sha }}"
      - name: Container logs on failure
        if: failure()
        run: docker logs aqi

  publish:
    name: Push image to GHCR
    needs: build-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMAGE_LC=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker build --build-arg GIT_SHA=${{ github.sha }} \
            -t "$IMAGE_LC:${{ github.sha }}" -t "$IMAGE_LC:latest" .
          docker push "$IMAGE_LC:${{ github.sha }}"
          docker push "$IMAGE_LC:latest"
